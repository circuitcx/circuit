name: Feature request
description: Suggest an idea or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: The use case or pain point, not just the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: dropdown
    id: component
    attributes:
      label: Area
      options:
        - Skill (/circuit)
        - MCP server (circuitcx)
        - Docs
        - Other
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
